name: Tag release

# Creates a new semver tag (vX.Y.Z) for every push to main.
# Bump is derived from Conventional Commits since the previous tag:
#   BREAKING CHANGE / "type!:"  -> major
#   feat                        -> minor
#   anything else               -> patch

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          set -euo pipefail

          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "HEAD is already tagged; nothing to do."
            exit 0
          fi

          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
          if [ "$last" = "v0.0.0" ]; then range="HEAD"; else range="$last..HEAD"; fi
          log="$(git log "$range" --format='%s%n%b%n--END--')"

          IFS=. read -r major minor patch <<< "${last#v}"
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE' <<< "$log"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          new="v$major.$minor.$patch"
          echo "$last -> $new"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$new" -m "$new"
          git push origin "$new"
