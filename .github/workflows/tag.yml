name: Tag release

# Runs `cz bump` on every push to main: bumps the version from Conventional Commits,
# updates CHANGELOG.md, commits "bump: version X -> Y" and pushes the commit and tag (vX.Y.Z).
# Commits that commitizen doesn't consider bumpable (docs, chore, ...) get a PATCH bump,
# so every push to main produces a new tag.
# Pushes made with GITHUB_TOKEN don't trigger workflows, so the bump commit can't loop.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  bump:
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Bump version, changelog and tag
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          uvx --from commitizen cz bump --yes
          rc=$?
          # 21 = no commits eligible for a bump (e.g. only docs/chore): force a patch release
          if [ "$rc" -eq 21 ]; then
            uvx --from commitizen cz bump --yes --increment PATCH
            rc=$?
          fi
          [ "$rc" -eq 0 ] || exit "$rc"

          git push origin HEAD:main --follow-tags
